name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ldp_test
      LOCAL_DB_NAME: ldp_test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      BACKEND_MODE: postgres
      NEXT_PUBLIC_GPS_SIMULATOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: ./scripts/db.sh reset ldp_dev && pnpm build
      - run: pnpm exec playwright test
        env: { E2E_BASE_URL: http://localhost:3000 }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: test-results }
